<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Premium Review Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, #00c6ff22, transparent 30%),
        radial-gradient(circle at bottom right, #7b2ff722, transparent 30%),
        #050816;
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
    }

    .bg-animation {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(45deg, #00c6ff33, #7b2ff733);
      animation: float 10s infinite linear;
      backdrop-filter: blur(10px);
    }

    .circle:nth-child(1) {
      width: 220px;
      height: 220px;
      top: 10%;
      left: 5%;
    }

    .circle:nth-child(2) {
      width: 280px;
      height: 280px;
      bottom: 10%;
      right: 5%;
      animation-duration: 14s;
    }

    .circle:nth-child(3) {
      width: 140px;
      height: 140px;
      top: 60%;
      left: 45%;
      animation-duration: 8s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(180deg);
      }

      100% {
        transform: translateY(0px) rotate(360deg);
      }
    }

    .container {
      width: 95%;
      max-width: 1300px;
      margin: auto;
      padding: 30px 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .title h1 {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(to right, #00c6ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title p {
      color: #94a3b8;
      margin-top: 8px;
    }

    .capacity-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 20px 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .capacity-box p {
      color: #94a3b8;
    }

    .capacity-box h2 {
      font-size: 38px;
      margin-top: 5px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .input-box {
      margin-bottom: 18px;
    }

    .input-box label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .input-box input {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid transparent;
      outline: none;
      background: #0f172acc;
      color: white;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 15px #00c6ff55;
    }

    .range-value {
      margin-top: 10px;
      color: #00c6ff;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(to right, #00c6ff, #7b2ff7);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 198, 255, 0.4);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stat-box p {
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .stat-box h3 {
      font-size: 38px;
    }

    .progress-card {
      margin-bottom: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #111827;
      border-radius: 50px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(to right, #00c6ff, #7b2ff7);
      transition: 1s;
    }

    .client-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .client-item {
      background: #0f172acc;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      animation: fadeUp 0.4s ease;
      gap: 10px;
      flex-wrap: wrap;
    }

    .client-item h4 {
      font-size: 20px;
    }

    .client-item p {
      color: #94a3b8;
      margin-top: 5px;
    }

    .delete-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 14px;
      background: #ff4d4d22;
      color: #ff6b6b;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .delete-btn:hover {
      background: #ff4d4d44;
      transform: scale(1.05);
    }

    @media(max-width:900px) {

      .dashboard {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 30px;
      }

    }
  </style>
</head>

<body>

  <div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="container">

    <div class="header">

      <div class="title">
        <h1>Review Dashboard</h1>
        <p>Premium Review Capacity Management System</p>
      </div>

      <div class="capacity-box">
        <p>Total Capacity</p>
        <h2 id="capacityText">500</h2>
      </div>

    </div>

    <div class="dashboard">

      <!-- LEFT PANEL -->

      <div class="card">

        <h2>Add Client</h2>

        <div class="input-box">
          <label>Client Name</label>
          <input type="text" id="clientName" placeholder="Enter Client Name">
        </div>

        <div class="input-box">
          <label>Reviews Count</label>
          <input type="number" id="reviewCount" placeholder="Enter Reviews">
        </div>

        <div class="input-box">
          <label>Total Capacity</label>

          <input type="range" min="100" max="10000" value="500" id="capacityRange">

          <div class="range-value">
            Capacity: <span id="rangeValue">500</span>
          </div>

        </div>

        <button class="btn" onclick="addClient()">
          Add Client
        </button>

      </div>

      <!-- RIGHT PANEL -->

      <div>

        <div class="stats">

          <div class="stat-box">
            <p>Total Clients</p>
            <h3 id="totalClients">0</h3>
          </div>

          <div class="stat-box">
            <p>Total Reviews</p>
            <h3 id="totalReviews">0</h3>
          </div>

          <div class="stat-box">
            <p>Remaining</p>
            <h3 id="remaining">500</h3>
          </div>

        </div>

        <div class="card progress-card">

          <div class="progress-top">
            <h2>Capacity Usage</h2>
            <h2 id="usagePercent">0%</h2>
          </div>

          <div class="progress-bar">
            <div class="progress" id="progress"></div>
          </div>

        </div>

        <div class="card">

          <div class="progress-top">
            <h2>Client List</h2>
            <p style="color:#94a3b8;">Live Tracking</p>
          </div>

          <div class="client-list" id="clientList">

            <div style="text-align:center;color:#64748b;padding:50px 0;">
              No Clients Added
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    let clients = [];
    let capacity = 500;

    const capacityRange = document.getElementById("capacityRange");

    capacityRange.addEventListener("input", function () {

      capacity = Number(this.value);

      document.getElementById("rangeValue").innerText = capacity;
      document.getElementById("capacityText").innerText = capacity;

      updateDashboard();

    });

    window.addClient = function () {

      const name = document.getElementById("clientName").value.trim();

      const reviews = Number(
        document.getElementById("reviewCount").value
      );

      if (name === "" || reviews <= 0) {

        alert("Please Enter Valid Details");
        return;

      }

      clients.unshift({
        id: Date.now(),
        name,
        reviews
      });

      document.getElementById("clientName").value = "";
      document.getElementById("reviewCount").value = "";

      renderClients();
      updateDashboard();

    }

    window.deleteClient = function (id) {

      clients = clients.filter(client => client.id !== id);

      renderClients();
      updateDashboard();

    }

    function updateDashboard() {

      const totalReviews = clients.reduce(
        (sum, client) => sum + client.reviews,
        0
      );

      const remaining = capacity - totalReviews;

      const usage = Math.min(
        (totalReviews / capacity) * 100,
        100
      );

      document.getElementById("totalClients").innerText =
        clients.length;

      document.getElementById("totalReviews").innerText =
        totalReviews;

      document.getElementById("remaining").innerText =
        remaining;

      document.getElementById("usagePercent").innerText =
        usage.toFixed(1) + "%";

      document.getElementById("progress").style.width =
        usage + "%";

    }

    function renderClients() {

      const clientList =
        document.getElementById("clientList");

      if (clients.length === 0) {

        clientList.innerHTML = `
        <div style="text-align:center;color:#64748b;padding:50px 0;">
          No Clients Added
        </div>
        `;

        return;

      }

      clientList.innerHTML = "";

      clients.forEach(client => {

        clientList.innerHTML += `

        <div class="client-item">

          <div>
            <h4>${client.name}</h4>
            <p>Reviews: ${client.reviews}</p>
          </div>

          <button class="delete-btn"
          onclick="deleteClient(${client.id})">

            Delete

          </button>

        </div>

        `;

      });

    }

  </script>

</body>

</html>
